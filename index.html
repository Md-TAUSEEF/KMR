<!doctype html>
<html lang="en">
  <head>
    <!-- =========================================================
         BASIC HTML
    ========================================================== -->

    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="theme-color"
      content="#102944"
    />

    <!-- =========================================================
         SEO
    ========================================================== -->

    <title>
      KMR Conchem | Construction Chemicals & Waterproofing Solutions
    </title>

    <meta
      name="description"
      content="KMR Conchem provides high-performance construction chemical solutions including waterproofing, concrete protection, repair and durable construction products for modern infrastructure."

    <meta
      name="keywords"
      content="KMR Conchem, construction chemicals, construction chemical solutions, waterproofing chemicals, waterproofing solutions, concrete chemicals, concrete repair chemicals, building chemicals, construction products, construction materials"

    <meta
      name="author"
      content="KMR Conchem"
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <meta
      name="googlebot"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <!-- =========================================================
         CANONICAL
    ========================================================== -->

    <link
      rel="canonical"
      href="https://kmrconchem.com/"
    />

    <!-- =========================================================
         FAVICON
         Logo is directly inside public/
    ========================================================== -->

    <link
      rel="icon"
      type="image/png"
      href="/kmr-logo.webp"
    />

    <link
      rel="apple-touch-icon"
      href="/kmr-logo.webp"
    />

    <!-- =========================================================
         OPEN GRAPH
    ========================================================== -->

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="KMR Conchem"
    />

    <meta
      property="og:title"
      content="KMR Conchem | Construction Chemicals & Waterproofing Solutions"
    />

    <meta
      property="og:description"
      content="High-performance construction chemical solutions engineered for waterproofing, concrete protection, repair, durability and long-lasting performance."

      property="og:url"
      content="https://kmrconchem.com/"
    />

    <meta
      property="og:image"
      content="https://kmrconchem.com/kmr-logo.png"
    />

    <meta
      property="og:image:alt"
      content="KMR Conchem Construction Chemical Solutions"
    />

         TWITTER / X
    ========================================================== -->

    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="KMR Conchem | Construction Chemicals & Waterproofing Solutions"
    />

    <meta
      name="twitter:description"
      content="KMR Conchem delivers reliable construction chemical solutions for waterproofing, concrete protection, repair and durable infrastructure."
    />

    <meta
      name="twitter:image"
      content="https://kmrconchem.com/kmr-logo.png"
    />

    <!-- =========================================================
         MOBILE / APP
    ========================================================== -->

    <meta
      name="mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-title"
      content="KMR Conchem"

    <script type="application/ld+json">
